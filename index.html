<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小玲阿姨 · 黑白市集</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 内嵌样式由 style.css 提供 */
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">小玲阿姨<span class="logo-dot">·</span>市集</a>
    <p class="tagline">BLACK &amp; WHITE STORE — 极简 · 精选 · 直跳 Marketplace</p>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>THINGS I SELL</h1>
    <p class="hero-sub">以下均为演示商品。点任一方格查看简介，喜欢就点「立即购买」，会跳转到 Facebook Marketplace。</p>
    <p class="hero-note">PURE STATIC · NO BACKEND</p>
  </section>

  <section id="grid" class="grid">
            <button class="card" type="button" aria-label="查看 复古机械键盘 简介" data-idx="0">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">复古机械键盘</div>
              <div class="card-price">¥ 299</div>
              <div class="card-cat">桌面 / 数码</div>
            </button>
            <button class="card" type="button" aria-label="查看 羊毛针织开衫 简介" data-idx="1">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">羊毛针织开衫</div>
              <div class="card-price">¥ 159</div>
              <div class="card-cat">服饰 / 毛衣</div>
            </button>
            <button class="card" type="button" aria-label="查看 手冲咖啡套装 简介" data-idx="2">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">手冲咖啡套装</div>
              <div class="card-price">¥ 199</div>
              <div class="card-cat">居家 / 咖啡</div>
            </button>
            <button class="card" type="button" aria-label="查看 极简帆布托特包 简介" data-idx="3">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">极简帆布托特包</div>
              <div class="card-price">¥ 89</div>
              <div class="card-cat">配饰 / 包包</div>
            </button>
            <button class="card" type="button" aria-label="查看 盆栽小绿植 简介" data-idx="4">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">盆栽小绿植</div>
              <div class="card-price">¥ 45</div>
              <div class="card-cat">居家 / 桌面</div>
            </button>
            <button class="card" type="button" aria-label="查看 皮质工装短靴 简介" data-idx="5">
              <div class="card-thumb"><div class="ph">◼</div></div>
              <div class="card-name">皮质工装短靴</div>
              <div class="card-price">¥ 249</div>
              <div class="card-cat">服饰 / 鞋靴</div>
            </button>
  </section>

</main>

<footer class="site-footer">
  <p>© 小玲阿姨 · 黑白市集 — 静态演示模板</p>
  <p class="footer-sub">购买链接指向 Facebook Marketplace</p>
</footer>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop" data-close></div>
  <article class="modal-card">
    <button class="modal-close" data-close aria-label="关闭">&times;</button>
    <div class="modal-thumb" data-thumb></div>
    <h2 id="modal-title" data-title></h2>
    <p class="modal-price" data-price></p>
    <p class="modal-desc" data-desc></p>
    <a class="btn btn-buy" data-buy href="#" target="_blank" rel="noopener noreferrer">立即购买 · 前往 Marketplace →</a>
  </article>
</div>

<script>
const PRODUCTS = [{"name": "复古机械键盘", "price": "¥ 299", "cat": "桌面 / 数码", "desc": "87 键茶轴，铝合金外壳，黑白撞色键帽。9 成新，功能完好，含原装数据线。", "img": "", "buy": "https://www.facebook.com/marketplace/"}, {"name": "羊毛针织开衫", "price": "¥ 159", "cat": "服饰 / 毛衣", "desc": "米灰混色羊毛混纺，M 码宽松版型，秋冬厚实保暖。无起球无瑕疵。", "img": "", "buy": "https://www.facebook.com/marketplace/"}, {"name": "手冲咖啡套装", "price": "¥ 199", "cat": "居家 / 咖啡", "desc": "玻璃分享壶 + 树脂滤杯 + 20 张滤纸 + 电子秤。日常自用，导热均匀。", "img": "", "buy": "https://www.facebook.com/marketplace/"}, {"name": "极简帆布托特包", "price": "¥ 89", "cat": "配饰 / 包包", "desc": "12 安厚帆布，黑底白字标语，内袋两个，可放 13 寸笔记本。全新未使用。", "img": "", "buy": "https://www.facebook.com/marketplace/"}, {"name": "盆栽小绿植", "price": "¥ 45", "cat": "居家 / 桌面", "desc": "白瓷小花盆配多肉，养了半年状态很好，皮实好养，附送营养土。仅限自取。", "img": "", "buy": "https://www.facebook.com/marketplace/"}, {"name": "皮质工装短靴", "price": "¥ 249", "cat": "服饰 / 鞋靴", "desc": "头层牛皮磨砂黑，41 码，厚底防滑。穿过一季，皮质完好。", "img": "", "buy": "https://www.facebook.com/marketplace/"}];
// 卡片已由服务端渲染；JS 只负责弹窗。
(function () {
  const grid = document.getElementById('grid');
  const modal = document.getElementById('modal');
  const mThumb = modal.querySelector('[data-thumb]');
  const mTitle = modal.querySelector('[data-title]');
  const mPrice = modal.querySelector('[data-price]');
  const mDesc = modal.querySelector('[data-desc]');
  const mBuy = modal.querySelector('[data-buy]');

  function open(idx) {
    const p = PRODUCTS[idx] || {};
    mThumb.innerHTML = p.img
      ? '<img src="' + p.img + '" alt="" class="thumb-img">'
      : '<span>◼</span>';
    mTitle.textContent = p.name || '';
    mPrice.textContent = p.price || '';
    mDesc.textContent = p.desc || '暂无简介。';
    mBuy.href = p.buy || 'https://www.facebook.com/marketplace/';
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  window.closeModal = function () {
    modal.classList.add('hidden');
    document.body.style.overflow = '';
  };

  grid.addEventListener('click', function (e) {
    const card = e.target.closest('.card');
    if (card) open(parseInt(card.dataset.idx, 10));
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) window.closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') window.closeModal();
  });
})();
</script>
</body>
</html>
