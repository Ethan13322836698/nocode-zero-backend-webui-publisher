<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Store · Black &amp; White Store</title>
<link rel="stylesheet" href="style.css">
<style>
  :root{--ink:#000000;--paper:#ffffff;--gray:#666666;--light:#efefef;--line:#c8c8c8;}[data-theme=dark]{--ink:#ffffff;--paper:#101010;--gray:#9a9a9a;--light:#1c1c1c;--line:#3a3a3a;}
</style>
</head>
<body>
<script>
  var _t=localStorage.getItem('bw-theme')||'system';document.documentElement.setAttribute('data-theme', _t==='system'? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : _t);window.toggleTheme=function(){ var e=document.documentElement.getAttribute('data-theme'); var n=(e==='dark')?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('bw-theme',n);};
</script>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">My Store<span class="logo-dot">·</span>Store</a>
    <button type="button" class="theme-toggle" onclick="window.toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark / light">◐</button>
  </div>
  
</header>

<main class="container">
  <section class="hero">
    <h1>Things I Sell</h1>
    <p class="hero-sub">Click a card to view details. Press BUY to jump over to Facebook Marketplace.</p>
    <p class="hero-note">JUMPS DIRECTLY TO FACEBOOK MARKETPLACE</p>
  </section>

  <section id="grid" class="grid">
            <button class="card" type="button" aria-label="View not sure details" data-idx="0">
              <div class="card-thumb"><img src="/images/image_1.jpg" alt="not sure" loading="lazy"></div>
              <div class="card-name">not sure</div>
              <div class="card-price">9999999999</div>
              <div class="card-cat">不知道</div>
            </button>
  </section>

</main>

<footer class="site-footer">
  
  
</footer>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop" data-close></div>
  <article class="modal-card">
    <button class="modal-close" data-close aria-label="关闭">&times;</button>
    <div class="modal-thumb" data-thumb></div>
    <h2 id="modal-title" data-title></h2>
    <p class="modal-price" data-price></p>
    <p class="modal-desc" data-desc></p>
    <a class="btn btn-buy" data-buy href="#" target="_blank" rel="noopener noreferrer">BUY NOW · GO TO FACEBOOK MARKETPLACE →</a>
  </article>
</div>

<script>
const PRODUCTS = [{"name": "not sure", "price": "9999999999", "cat": "不知道", "desc": "Hey", "buy": "https://www.facebook.com/marketplace/", "buy_text": "Just Go to here", "img": "images/image_1.jpg"}];
const BUY_DEFAULT = "BUY NOW · GO TO FACEBOOK MARKETPLACE →";
// 卡片已由服务端渲染；JS 只负责弹窗。
(function () {
  const grid = document.getElementById('grid');
  const modal = document.getElementById('modal');
  const mThumb = modal.querySelector('[data-thumb]');
  const mTitle = modal.querySelector('[data-title]');
  const mPrice = modal.querySelector('[data-price]');
  const mDesc = modal.querySelector('[data-desc]');
  const mBuy = modal.querySelector('[data-buy]');

  function open(idx) {
    const p = PRODUCTS[idx] || {};
    mThumb.innerHTML = p.img
      ? '<img src="' + p.img + '" alt="" class="thumb-img">'
      : '<span>◼</span>';
    mTitle.textContent = p.name || '';
    mPrice.textContent = p.price || '';
    mDesc.textContent = p.desc || 'No description yet.';
    mBuy.href = p.buy || 'https://www.facebook.com/marketplace/';
    mBuy.textContent = p.buy_text || BUY_DEFAULT;
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  window.closeModal = function () {
    modal.classList.add('hidden');
    document.body.style.overflow = '';
  };

  grid.addEventListener('click', function (e) {
    const card = e.target.closest('.card');
    if (card) open(parseInt(card.dataset.idx, 10));
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) window.closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') window.closeModal();
  });
})();
</script>
</body>
</html>
